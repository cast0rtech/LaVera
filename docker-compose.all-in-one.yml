# ==============================================================================
# LaVera Hub - Standalone Lightweight Appliance
# Ideal for Raspberry Pi 3/4/5 Zero-Cloud Local Deployments
# ==============================================================================

services:
  lavera-hub:
    build:
      context: .
      dockerfile: Dockerfile
    image: lavera-hub:all-in-one
    container_name: lavera_hub
    restart: always
    ports:
      - "8088:8088"
      - "8080:8088"
    environment:
      - TZ=Europe/Madrid
      - PORT=8088
      - LAVERA_DB_PATH=/app/data/lavera.db
      - INFLUXDB_URL=${INFLUXDB_URL:-}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-lavera}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-ev_telemetry}
    volumes:
      - ./ev-telemetry-hub/data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
