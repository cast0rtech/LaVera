version: '3.8'

services:
  homeassistant:
    image: lscr.io/linuxserver/homeassistant:latest
    container_name: telemetry_ha
    ports:
      - "8123:8123"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Zurich
    volumes:
      - ./ev-telemetry-hub/data/homeassistant:/config
    restart: always
    networks:
      - telemetry_net

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: telemetry_timescale
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=lavera
      - POSTGRES_PASSWORD=LaVeraSecurePass2026!
      - POSTGRES_DB=lavera_telemetry
      - TZ=Europe/Zurich
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./ev-telemetry-hub/sql/init-timescaledb.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lavera -d lavera_telemetry"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    networks:
      - telemetry_net

  nodered:
    image: nodered/node-red:latest
    container_name: telemetry_nodered
    ports:
      - "1880:1880"
    environment:
      - TZ=Europe/Zurich
    volumes:
      - ./ev-telemetry-hub/data/nodered:/data
    restart: always
    networks:
      - telemetry_net

  grafana:
    image: grafana/grafana:latest
    container_name: telemetry_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - TZ=Europe/Zurich
    volumes:
      - ./ev-telemetry-hub/data/grafana:/var/lib/grafana
      - ./ev-telemetry-hub/grafana/provisioning:/etc/grafana/provisioning:ro
    restart: always
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - telemetry_net

networks:
  telemetry_net:
    driver: bridge

volumes:
  timescale_data:
