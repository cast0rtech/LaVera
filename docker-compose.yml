# ==============================================================================
# LaVera Full EV Telemetry Stack - Modern Compose Specification
# Compatible with Docker Engine 27+ / 28+ & Docker Compose v2
# Supported: x86_64, ARM64 (Raspberry Pi 4/5), ARMv7 (Raspberry Pi 3)
# ==============================================================================

services:
  lavera-hub:
    build:
      context: .
      dockerfile: Dockerfile
    image: lavera-hub:latest
    container_name: lavera_hub
    restart: always
    ports:
      - "8080:8080"
      - "8088:8088"
    environment:
      - TZ=Europe/Madrid
      - PORT=8088
      - LAVERA_DB_PATH=/app/data/lavera.db
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=LaVeraSuperSecretAdminToken2026!
      - INFLUXDB_ORG=lavera
      - INFLUXDB_BUCKET=ev_telemetry
      - POSTGRES_HOST=timescaledb
      - POSTGRES_PORT=5432
      - POSTGRES_USER=lavera
      - POSTGRES_PASSWORD=LaVeraSecurePass2026!
      - POSTGRES_DB=lavera_telemetry
    volumes:
      - ./ev-telemetry-hub/data:/app/data
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - telemetry_net

  influxdb:
    image: influxdb:2.7-alpine
    container_name: telemetry_influxdb
    restart: always
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=lavera
      - DOCKER_INFLUXDB_INIT_PASSWORD=LaVeraSecurePass2026!
      - DOCKER_INFLUXDB_INIT_ORG=lavera
      - DOCKER_INFLUXDB_INIT_BUCKET=ev_telemetry
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=LaVeraSuperSecretAdminToken2026!
      - DOCKER_INFLUXDB_INIT_RETENTION=0
    volumes:
      - influxdb_data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - telemetry_net

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: telemetry_timescale
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=lavera
      - POSTGRES_PASSWORD=LaVeraSecurePass2026!
      - POSTGRES_DB=lavera_telemetry
      - TZ=Europe/Madrid
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./ev-telemetry-hub/sql/init-timescaledb.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lavera -d lavera_telemetry"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - telemetry_net

  nodered:
    image: nodered/node-red:latest
    container_name: telemetry_nodered
    restart: always
    ports:
      - "1880:1880"
    environment:
      - TZ=Europe/Madrid
    volumes:
      - ./ev-telemetry-hub/data/nodered:/data
    networks:
      - telemetry_net

  grafana:
    image: grafana/grafana:latest
    container_name: telemetry_grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - TZ=Europe/Madrid
    volumes:
      - ./ev-telemetry-hub/data/grafana:/var/lib/grafana
      - ./ev-telemetry-hub/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      influxdb:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    networks:
      - telemetry_net

  homeassistant:
    image: lscr.io/linuxserver/homeassistant:latest
    container_name: telemetry_ha
    restart: always
    ports:
      - "8123:8123"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - ./ev-telemetry-hub/data/homeassistant:/config
    networks:
      - telemetry_net

networks:
  telemetry_net:
    driver: bridge

volumes:
  influxdb_data:
  timescale_data:
