<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="castorGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="crownGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FF9800" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Circle with gap for plug -->
  <path d="M 45 160 A 85 85 0 1 1 155 160" fill="none" stroke="url(#castorGreen)" stroke-width="7" stroke-linecap="round"/>

  <!-- Top Crown / Tech Drone Badge -->
  <g transform="translate(100, 42) scale(0.85)">
    <!-- Small Crown -->
    <path d="M -16 6 L -22 -10 L -10 -3 L 0 -14 L 10 -3 L 22 -10 L 16 6 Z" fill="url(#crownGold)"/>
    <circle cx="0" cy="-14" r="2.5" fill="#FFF"/>
    <circle cx="-22" cy="-10" r="2" fill="#FFF"/>
    <circle cx="22" cy="-10" r="2" fill="#FFF"/>
    <!-- Drone Quad Arms / Core -->
    <circle cx="0" cy="12" r="4" fill="#00E676"/>
    <line x1="-12" y1="12" x2="12" y2="12" stroke="#00E676" stroke-width="2"/>
    <line x1="0" y1="4" x2="0" y2="20" stroke="#00E676" stroke-width="2"/>
    <circle cx="-12" cy="12" r="3" fill="none" stroke="#FFF" stroke-width="1.5"/>
    <circle cx="12" cy="12" r="3" fill="none" stroke="#FFF" stroke-width="1.5"/>
  </g>

  <!-- Middle Text: castor_tech -->
  <text x="100" y="112" text-anchor="middle" font-family="'Courier New', 'Cinzel', 'Trajan Pro', Georgia, serif" font-weight="900" font-size="23" font-style="italic" fill="#00E676" letter-spacing="-0.5" filter="url(#glow)">
    castor_tech
  </text>

  <!-- Bottom Electric Plug -->
  <g transform="translate(100, 162)">
    <!-- Plug Neck / Top block -->
    <path d="M -18 -4 L 18 -4 L 14 18 C 14 26 -14 26 -14 18 Z" fill="url(#castorGreen)"/>
    <!-- Prongs -->
    <rect x="-10" y="24" width="5" height="16" rx="2.5" fill="url(#castorGreen)"/>
    <rect x="5" y="24" width="5" height="16" rx="2.5" fill="url(#castorGreen)"/>
    <!-- Connecting line to circle ends -->
    <path d="M -45 -2 L -18 -4" stroke="url(#castorGreen)" stroke-width="7" stroke-linecap="round"/>
    <path d="M 18 -4 L 45 -2" stroke="url(#castorGreen)" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
