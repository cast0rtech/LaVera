version: '3.8'

services:
  # 1. Extractor Multimarca
  homeassistant:
    image: lscr.io/linuxserver/homeassistant:latest
    container_name: telemetry_ha
    ports:
      - "8123:8123"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Zurich
    volumes:
      - ./data/homeassistant:/config
    restart: always
    networks:
      - telemetry_net

  # 2. Base de Datos de Series Temporales (InfluxDB 2.7)
  influxdb:
    image: influxdb:2.7
    container_name: telemetry_influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=LaVeraSecurePass2026!
      - DOCKER_INFLUXDB_INIT_ORG=EV_Telemetry
      - DOCKER_INFLUXDB_INIT_BUCKET=vehicle_data
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=lavera_master_token_2026_super_secure
      - DOCKER_INFLUXDB_INIT_RETENTION=0
    volumes:
      # Named volume avoids Windows NTFS flock/BoltDB file locking crashes
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: always
    networks:
      - telemetry_net

  # 3. Procesamiento y L?gica
  nodered:
    image: nodered/node-red:latest
    container_name: telemetry_nodered
    ports:
      - "1880:1880"
    environment:
      - TZ=Europe/Zurich
    volumes:
      - ./data/nodered:/data
    restart: always
    networks:
      - telemetry_net

  # 4. Dashboard de Visualizaci?n
  grafana:
    image: grafana/grafana:latest
    container_name: telemetry_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - TZ=Europe/Zurich
    volumes:
      - ./data/grafana:/var/lib/grafana
    restart: always
    depends_on:
      influxdb:
        condition: service_healthy
    networks:
      - telemetry_net

networks:
  telemetry_net:
    driver: bridge

volumes:
  influxdb_data:
  influxdb_config:
